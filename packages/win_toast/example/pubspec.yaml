name: win_toast_example
description: Demonstrates how to use the win_toast plugin.

publish_to: 'none'

environment:
  sdk: ">=3.8.0 <4.0.0"
  flutter: ">=3.38.0"

dependencies:
  flutter:
    sdk: flutter

  win_toast:
    path: ../
  cupertino_icons: ^1.0.8
  xml: ^6.6.1
  mixin_logger: ^0.1.3
  path_provider: ^2.1.5
  path: ^1.9.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  msix: ^3.16.12

flutter:
  uses-material-design: true
  assets:
    - assets/image.png

msix_config:
  display_name: WinToastExample
  identity_name: one.mixin.WinToastExample
  toast_activator:
    clsid: "936C39FC-6BBC-4A57-B8F8-7C627E401B2F"
    arguments: "-ToastActivated"
    display_name: "Example Application"
  msix_version: 1.0.4.0