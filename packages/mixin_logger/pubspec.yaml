name: mixin_logger
description: Simple logger tool for flutter, make it easy to save your app log to file.
version: 0.1.2
homepage: https://github.com/MixinNetwork/flutter-plugins

environment:
  sdk: ">=3.8.0 <4.0.0"
  flutter: ">=3.38.0"

dependencies:
  flutter:
    sdk: flutter
  ansicolor: ^2.0.3
  path: ^1.9.1
  ffi: ^2.1.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  intl: ^0.20.2
  ffigen: ^20.1.0


flutter:
  plugin:
    platforms:
      ios:
        ffiPlugin: true
      linux:
        ffiPlugin: true
      macos:
        ffiPlugin: true
      windows:
        ffiPlugin: true
      android:
        ffiPlugin: true